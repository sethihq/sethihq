name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sethihq
          outputs: |
            dist/snake-light.svg?color_snake=#2f5be0&color_dots=#ebe8e3,#d9e2fb,#a9bdf5,#6f8fec,#2f5be0
            dist/snake-dark.svg?palette=github-dark&color_snake=#ec9ed7&color_dots=#24211f,#2c3a66,#3f5bb8,#5b82ff,#9db5ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
