name: tokens

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I tools/tokens.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tokens-light.svg tokens-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh tokenmaxxing card"
          git push
