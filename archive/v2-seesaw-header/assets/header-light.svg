<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Rajat Sethi, product designer and design engineer. One heavy thing outweighs a pile of light things.">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { font-size: 50px; font-weight: 650; letter-spacing: -1.6px; fill: #2b2826; }
    .sub  { font-size: 18px; font-weight: 450; fill: #7a746d; }
    .eq   { font-size: 15px; font-weight: 550; fill: #7a746d; letter-spacing: .4px; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .beam { transform-origin: 700px 168px; animation: tip 1.6s cubic-bezier(.3,1.5,.5,1) .5s forwards, sway 5s ease-in-out 2.1s infinite; transform: rotate(0deg); }
    @keyframes tip  { from { transform: rotate(0deg); } to { transform: rotate(-9deg); } }
    @keyframes sway { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(-10.5deg); } }
    .drop { opacity: 0; animation: drop .5s cubic-bezier(.5,0,.75,0) forwards; }
    @keyframes drop { from { opacity: 0; transform: translateY(-26px); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .drop { animation: none; opacity: 1; }
      .beam { animation: none; transform: rotate(-9deg); }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="239" rx="24" fill="#f7f6f4" stroke="#e7e4df"/>

  <g class="t">
    <text class="name rise d1" x="48" y="112">rajat sethi</text>
    <text class="sub rise d2" x="50" y="148">product designer and design engineer, 23, bangalore</text>
    <text class="eq rise d3" x="50" y="186">H &gt; &#8721;L</text>
    <text class="eq rise d3" x="104" y="186" style="font-weight:450">one heavy thing outweighs a pile of light ones</text>
  </g>

  <!-- pivot -->
  <path d="M700 170 L716 200 L684 200 Z" fill="#cfcac3"/>
  <line x1="660" y1="200.5" x2="740" y2="200.5" stroke="#cfcac3" stroke-width="1"/>

  <!-- beam with two trays: heavy on the left, light on the right -->
  <g class="beam">
    <rect x="584" y="166" width="232" height="5" rx="2.5" fill="#2b2826"/>
    <path d="M588 166 V156 M640 166 V156" stroke="#2b2826" stroke-width="3" stroke-linecap="round"/>
    <path d="M760 166 V158 M812 166 V158" stroke="#2b2826" stroke-width="3" stroke-linecap="round"/>
    <circle class="drop" style="animation-delay:.15s" cx="614" cy="144" r="22" fill="#2f5be0"/>
    <g>
      <circle class="drop" style="animation-delay:.2s"  cx="770" cy="159" r="6" fill="#e690cf"/>
      <circle class="drop" style="animation-delay:.26s" cx="783" cy="159" r="6" fill="#f2c641"/>
      <circle class="drop" style="animation-delay:.32s" cx="796" cy="159" r="6" fill="#e690cf"/>
      <circle class="drop" style="animation-delay:.38s" cx="776.5" cy="148.5" r="6" fill="#f2c641"/>
      <circle class="drop" style="animation-delay:.44s" cx="789.5" cy="148.5" r="6" fill="#e690cf"/>
    </g>
  </g>
</svg>
