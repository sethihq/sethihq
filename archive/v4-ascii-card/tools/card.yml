name: card

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I tools/card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add card-light.svg card-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile card stats"
          git push
